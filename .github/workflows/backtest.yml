name: backtest
on:
  workflow_dispatch:
    inputs:
      period:
        description: "Days of data (7d, 15d, 30d)"
        default: "7d"
      min_move:
        description: "Minimum % move filter"
        default: "1.0"
      wait:
        description: "Extra candles allowed before the breakout (0 = next candle only)"
        default: "0"
      check:
        description: "Stocks to explain, e.g. INDIACEM,SONACOMS (empty = full scan)"
        default: ""
      check_date:
        description: "Date for check, e.g. 2026-10-30 (empty = last trading day)"
        default: ""
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas requests
      - run: python backtest.py
        env:
          PERIOD: ${{ inputs.period }}
          MIN_MOVE: ${{ inputs.min_move }}
          WAIT: ${{ inputs.wait }}
          CHECK: ${{ inputs.check }}
          CHECK_DATE: ${{ inputs.check_date }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
